aid: yuanfudao
name: Yuanfudao
description: >-
  Yuanfudao (猿辅导) is a Beijing-based online education technology company founded in 2012 and
  operated under Kanyun Holdings (看云控股集团). Its consumer products include the Yuanfudao tutoring
  platform, Zebra AI Learning (斑马AI学), Xiaoyuan AI / Xiaoyuan Kousuan (小猿AI / 小猿口算), Xiaoyuan
  Souti (小猿搜题), Ape Programming (猿编程) and Haitun Zixi (海豚自习), delivering live classes, smart
  practice and problem-solving analysis to K-12 and preschool learners in China. The company
  publishes no public developer program, API reference or machine-readable API contract; its
  visible public engineering surface is the kanyun-inc GitHub organization of open-source
  libraries and developer tooling, and the Kanyun Security Response Center (YSRC) vulnerability
  disclosure program at security.kanyun.com.
